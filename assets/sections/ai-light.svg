<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img" aria-label="AI coding agents">
  <defs>
    <linearGradient id="lnail" x1="0" x2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".45" stop-color="#0e7490" stop-opacity=".55"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient>
    <radialGradient id="dotail"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
  </defs>
  <style>.m{display:none}@media (max-width:600px){.d{display:none}.m{display:inline}}</style>
  <g class="d"><polygon points="2,40 24,18 24,40" fill="#1d4ed8"/>
  <text x="36" y="38" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="25" font-weight="800" fill="#0f172a">AI coding agents</text></g>
  <g class="m"><polygon points="2,44 32,12 32,44" fill="#1d4ed8"/>
  <text x="46" y="44" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="44" font-weight="800" fill="#0f172a">AI coding agents</text></g>
  <rect x="0" y="50" width="900" height="2" rx="1" fill="url(#lnail)"/>
  <ellipse cx="0" cy="51" rx="40" ry="3.5" fill="url(#dotail)"><animate attributeName="cx" values="-40;940" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.55;.8" dur="4.5s" repeatCount="indefinite"/></ellipse>
</svg>
