<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 76" width="400" height="76" role="img" aria-label="SmartGrid — Windows 10/11 tiling">
  <defs>
    <linearGradient id="bgsmad" x1="0" x2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <radialGradient id="glsmad" cx=".08" cy=".5" r=".35"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="nmsmad" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.4 0;.4 0;-.4 0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="shsmad" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <clipPath id="cpsmad"><rect x="1" y="1" width="398" height="74" rx="11"/></clipPath>
  </defs>
  <g clip-path="url(#cpsmad)">
    <rect width="400" height="76" fill="url(#bgsmad)"/>
    <rect width="400" height="76" fill="url(#glsmad)"/>
    <rect x="-120" y="73" width="120" height="3" fill="url(#shsmad)"><animate attributeName="x" values="-120;400" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="398" height="74" rx="11" fill="none" stroke="#26324a" stroke-width="1.5"/>
  <g transform="translate(18 18) scale(1)"><rect x="0" y="0" width="18" height="18" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="22" y="0" width="18" height="18" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="0" y="22" width="18" height="18" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="22" y="22" width="18" height="18" rx="3" stroke="#a78bfa" fill="#a78bfa" fill-opacity=".25" stroke-width="2.2"/></g>
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="74" y="39" font-size="26" font-weight="800" fill="url(#nmsmad)">SmartGrid</text>
    <text x="75" y="59" font-size="13" fill="#8b98ad">Windows 10/11 tiling</text>
