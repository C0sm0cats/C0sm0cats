<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 76" width="400" height="76" role="img" aria-label="GMAIL — Gmail in your terminal">
  <defs>
    <linearGradient id="bggmal" x1="0" x2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f9"/></linearGradient>
    <radialGradient id="glgmal" cx=".08" cy=".5" r=".35"><stop offset="0" stop-color="#6d28d9" stop-opacity=".28"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <linearGradient id="nmgmal" x1="0" x2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#a21caf"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.4 0;.4 0;-.4 0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="shgmal" x1="0" x2="1"><stop offset="0" stop-color="#6d28d9" stop-opacity="0"/><stop offset=".5" stop-color="#6d28d9" stop-opacity=".9"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></linearGradient>
    <clipPath id="cpgmal"><rect x="1" y="1" width="398" height="74" rx="11"/></clipPath>
  </defs>
  <g clip-path="url(#cpgmal)">
    <rect width="400" height="76" fill="url(#bggmal)"/>
    <rect width="400" height="76" fill="url(#glgmal)"/>
    <rect x="-120" y="73" width="120" height="3" fill="url(#shgmal)"><animate attributeName="x" values="-120;400" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="398" height="74" rx="11" fill="none" stroke="#c9d2e0" stroke-width="1.5"/>
  <g transform="translate(18 18) scale(1)"><rect x="0" y="6" width="40" height="28" rx="4" fill="none" stroke="#6d28d9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 9 L20 23 L38 9" fill="none" stroke="#a21caf" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="74" y="39" font-size="26" font-weight="800" fill="url(#nmgmal)">GMAIL</text>
    <text x="75" y="59" font-size="13" fill="#526077">Gmail in your terminal</text>
  </g>
  <g fill="#526077" opacity=".7"><path d="M372 32 l7 6 -7 6" fill="none" stroke="#526077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></path></g>
