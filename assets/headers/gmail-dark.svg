  <g transform="translate(14 10) scale(1.4)"><rect x="0" y="6" width="40" height="28" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 9 L20 23 L38 9" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <text x="90" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="40" font-weight="800" fill="url(#nmgmad)">GMAIL</text>
  </g>
