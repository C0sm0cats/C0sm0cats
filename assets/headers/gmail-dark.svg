<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 76" width="400" height="76" role="img" aria-label="GMAIL — Gmail in your terminal">
  <defs>
    <linearGradient id="bggmad" x1="0" x2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <radialGradient id="glgmad" cx=".08" cy=".5" r=".35"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="nmgmad" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.4 0;.4 0;-.4 0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="shgmad" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <clipPath id="cpgmad"><rect x="1" y="1" width="398" height="74" rx="11"/></clipPath>
  </defs>
  <g clip-path="url(#cpgmad)">
    <rect width="400" height="76" fill="url(#bggmad)"/>
    <rect width="400" height="76" fill="url(#glgmad)"/>
    <rect x="-120" y="73" width="120" height="3" fill="url(#shgmad)"><animate attributeName="x" values="-120;400" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="398" height="74" rx="11" fill="none" stroke="#26324a" stroke-width="1.5"/>
  <style>.m{display:none}@media (max-width:300px){.d{display:none}.m{display:inline}}</style>
  <g class="d">
  <g transform="translate(18 18)"><rect x="0" y="6" width="40" height="28" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 9 L20 23 L38 9" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="74" y="39" font-size="26" font-weight="800" fill="url(#nmgmad)">GMAIL</text>
    <text x="75" y="59" font-size="13" fill="#8b98ad">Gmail in your terminal</text>
  </g>
  <g fill="#8b98ad" opacity=".7"><path d="M372 32 l7 6 -7 6" fill="none" stroke="#8b98ad" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></path></g>
  </g>
