<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Thanks for stopping by — find something useful? A star helps others discover it.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".4"><stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2740" stroke-width="1"/></pattern>
    <linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.5 0;.5 0;-.5 0" dur="8s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="cp"><rect width="900" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#cp)">
    <rect width="900" height="120" fill="url(#bg)"/>
    <rect width="900" height="120" fill="url(#grid)" opacity=".5"/>
    <rect width="900" height="120" fill="url(#gl)"/>
    <circle cx="70" cy="30" r="1.1" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="0s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="150" cy="96" r="1" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="1.2s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="420" cy="20" r="1.3" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="2s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="640" cy="104" r="1" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="0.6s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="760" cy="24" r="1.2" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="2.6s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="850" cy="92" r="1" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="1.7s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="870" cy="30" r="0.9" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="0.3s" repeatCount="indefinite" values=".15;1;.15"/></circle><circle cx="30" cy="96" r="1" fill="#cfe8ff"><animate attributeName="opacity" dur="3.6s" begin="2.2s" repeatCount="indefinite" values=".15;1;.15"/></circle>
    <rect x="-240" y="0" width="240" height="2" fill="url(#sh)"><animate attributeName="x" values="-240;900" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".75" y=".75" width="898.5" height="118.5" rx="16" fill="none" stroke="#26324a" stroke-width="1.5"/>
  <g transform="translate(196 60)">
    <polygon points="0.0,-22.0 5.3,-7.3 20.9,-6.8 8.6,2.8 12.9,17.8 0.0,9.0 -12.9,17.8 -8.6,2.8 -20.9,-6.8 -5.3,-7.3" fill="#fbbf24" filter="url(#sg)" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="2.8s" repeatCount="indefinite"/></polygon>
    <polygon points="0.0,-20.0 5.0,-6.9 19.0,-6.2 8.1,2.6 11.8,16.2 0.0,8.5 -11.8,16.2 -8.1,2.6 -19.0,-6.2 -5.0,-6.9" fill="#fbbf24">
      <animateTransform attributeName="transform" type="rotate" values="0;0;72;72" keyTimes="0;.7;.85;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.6 0 .3 1;0 0 1 1"/></polygon>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="238" y="55" font-size="28" font-weight="800" fill="url(#nm)">Thanks for stopping by</text>
    <text x="239" y="82" font-size="15" fill="#8b98ad">Find something useful? A star helps others discover it.</text>
  </g>
</svg>
